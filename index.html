<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Prayer Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #B8860B;
    --gold-light: #D4AF37;
    --gold-pale: #F5EDD3;
    --dark: #1A1208;
    --med: #4A3F2A;
    --lite: #8A7A5A;
    --cream: #FBF8F1;
    --cream2: #F2ECD8;
    --white: #FFFDF8;
    --shadow: 0 2px 20px rgba(184,134,11,0.10);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lato', sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; }

  /* ── TOP NAV ── */
  .nav { background: var(--dark); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .nav-brand { font-family: 'Playfair Display', serif; color: var(--gold-light); font-size: 1.1rem; letter-spacing: 0.04em; display: flex; align-items: center; gap: 10px; }
  .cross { font-size: 1.2rem; color: var(--gold); }
  .nav-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); font-family: 'Lato', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 16px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
  .nav-btn:hover { background: var(--gold); color: var(--dark); }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── HOME VIEW ── */
  .home-hero { text-align: center; padding: 4rem 2rem 2rem; }
  .home-hero h1 { font-family: 'Playfair Display', serif; font-size: 2.4rem; color: var(--dark); margin-bottom: 0.4rem; }
  .home-hero p { color: var(--lite); font-size: 0.95rem; font-weight: 300; letter-spacing: 0.05em; }
  .gold-rule { width: 60px; height: 2px; background: var(--gold); margin: 1.2rem auto; }

  .entries-container { max-width: 680px; margin: 0 auto; padding: 1rem 1.5rem 4rem; }
  .year-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--lite); margin: 2rem 0 0.75rem; }
  .entry-card { background: var(--white); border: 0.5px solid rgba(184,134,11,0.25); border-radius: var(--radius); padding: 1.1rem 1.5rem; margin-bottom: 0.6rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.18s; box-shadow: var(--shadow); }
  .entry-card:hover { border-color: var(--gold); transform: translateY(-1px); box-shadow: 0 4px 24px rgba(184,134,11,0.18); }
  .entry-date-info { display: flex; align-items: center; gap: 1.2rem; }
  .entry-cal { text-align: center; min-width: 44px; }
  .entry-cal .month { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
  .entry-cal .day { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--dark); line-height: 1; }
  .entry-info .weekday { font-size: 0.75rem; color: var(--lite); letter-spacing: 0.05em; margin-bottom: 2px; }
  .entry-info .count { font-size: 0.88rem; color: var(--med); font-weight: 400; }
  .entry-arrow { color: var(--gold-light); font-size: 1.1rem; opacity: 0.7; }
  .entry-card:hover .entry-arrow { opacity: 1; }

  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--lite); }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .empty-state p { font-size: 0.9rem; line-height: 1.7; }

  /* ── ADD PRAYER VIEW ── */
  .form-container { max-width: 660px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }
  .form-header { text-align: center; margin-bottom: 2rem; }
  .form-header h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--dark); }
  .form-header p { color: var(--lite); font-size: 0.9rem; margin-top: 4px; }

  .date-display { background: var(--gold-pale); border: 1px solid rgba(184,134,11,0.3); border-radius: 8px; padding: 0.7rem 1.2rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px; }
  .date-display label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); min-width: 40px; }
  .date-display input[type="date"] { border: none; background: transparent; font-family: 'Lato', sans-serif; font-size: 0.95rem; color: var(--dark); cursor: pointer; outline: none; flex: 1; }

  .prayer-form-block { background: var(--white); border: 0.5px solid rgba(184,134,11,0.2); border-radius: var(--radius); padding: 1.4rem 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .prayer-form-block .block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .prayer-form-block .block-num { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
  .remove-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 2px 6px; border-radius: 4px; transition: color 0.15s; }
  .remove-btn:hover { color: #e55; }

  .form-row { margin-bottom: 0.9rem; }
  .form-row label { display: block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lite); margin-bottom: 5px; }
  .form-row input, .form-row textarea, .form-row select { width: 100%; border: 0.5px solid rgba(0,0,0,0.15); border-radius: 7px; padding: 9px 12px; font-family: 'Lato', sans-serif; font-size: 0.93rem; color: var(--dark); background: var(--cream); outline: none; transition: border-color 0.15s; }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--gold); background: var(--white); }
  .form-row textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .form-row select { cursor: pointer; }

  .verse-entry { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .verse-entry .ref-input { flex: 0 0 130px; }
  .verse-entry .verse-input { flex: 1; }
  .verse-entry button { flex: 0 0 28px; height: 38px; background: none; border: 0.5px solid #ddd; border-radius: 5px; cursor: pointer; color: #aaa; font-size: 0.85rem; transition: all 0.15s; }
  .verse-entry button:hover { border-color: #e55; color: #e55; }
  .add-verse-btn { font-size: 0.78rem; color: var(--gold); background: none; border: 1px dashed var(--gold-light); border-radius: 5px; padding: 5px 12px; cursor: pointer; font-family: 'Lato', sans-serif; transition: all 0.15s; margin-top: 2px; }
  .add-verse-btn:hover { background: var(--gold-pale); }

  .add-prayer-btn { width: 100%; border: 1.5px dashed rgba(184,134,11,0.4); border-radius: var(--radius); padding: 1rem; background: none; cursor: pointer; color: var(--gold); font-family: 'Lato', sans-serif; font-size: 0.88rem; letter-spacing: 0.06em; text-transform: uppercase; transition: all 0.2s; margin-bottom: 1.5rem; }
  .add-prayer-btn:hover { background: var(--gold-pale); border-color: var(--gold); }

  .save-btn { width: 100%; background: var(--dark); color: var(--gold-light); border: none; border-radius: var(--radius); padding: 1rem; font-family: 'Playfair Display', serif; font-size: 1.1rem; cursor: pointer; letter-spacing: 0.04em; transition: all 0.2s; }
  .save-btn:hover { background: var(--gold); color: var(--dark); }

  /* ── DAY VIEW ── */
  .day-container { max-width: 680px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }
  .day-header { text-align: center; margin-bottom: 2.5rem; }
  .day-header .back-link { font-size: 0.78rem; color: var(--lite); cursor: pointer; letter-spacing: 0.05em; display: inline-block; margin-bottom: 1rem; transition: color 0.15s; }
  .day-header .back-link:hover { color: var(--gold); }
  .day-header h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--dark); }
  .day-header .full-date { font-size: 0.85rem; color: var(--lite); margin-top: 4px; font-weight: 300; letter-spacing: 0.05em; }

  .prayer-entry { background: var(--white); border: 0.5px solid rgba(184,134,11,0.2); border-radius: var(--radius); padding: 1.4rem 1.6rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .prayer-entry .p-tag { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .prayer-entry h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--dark); margin-bottom: 8px; }
  .prayer-entry .p-rule { height: 1px; background: var(--gold-pale); margin-bottom: 10px; }
  .prayer-entry .p-text { font-size: 0.92rem; color: var(--med); line-height: 1.75; margin-bottom: 14px; font-style: italic; }
  .verse-item { margin-bottom: 10px; border-left: 2px solid var(--gold-light); padding-left: 12px; }
  .verse-item .v-ref { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
  .verse-item .v-text { font-size: 0.9rem; color: var(--dark); line-height: 1.65; font-style: italic; }

  .day-actions { display: flex; gap: 10px; margin-top: 2rem; }
  .day-actions button { flex: 1; border: 1px solid rgba(184,134,11,0.4); background: none; border-radius: 8px; padding: 10px; font-family: 'Lato', sans-serif; font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; color: var(--gold); transition: all 0.18s; }
  .day-actions button:hover { background: var(--gold-pale); border-color: var(--gold); }
  .day-actions .del-btn { color: #aaa; border-color: #ddd; }
  .day-actions .del-btn:hover { color: #e55; border-color: #e55; background: #fff5f5; }

  .print-btn { background: var(--dark); color: var(--gold-light); border-color: var(--dark) !important; }
  .print-btn:hover { background: var(--gold) !important; color: var(--dark) !important; }

  /* ── MODAL ── */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--white); border-radius: var(--radius); padding: 2rem; max-width: 380px; width: 90%; text-align: center; }
  .modal h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 0.6rem; }
  .modal p { font-size: 0.88rem; color: var(--lite); margin-bottom: 1.5rem; line-height: 1.6; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-family: 'Lato', sans-serif; font-size: 0.88rem; transition: all 0.15s; }
  .modal-btns .confirm { background: #e55; color: white; border-color: #e55; }
  .modal-btns .confirm:hover { background: #c44; }
  .modal-btns .cancel-m:hover { background: var(--cream); }

  @media print {
    .nav, .day-actions { display: none !important; }
    body { background: white; }
    .prayer-entry { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
    .day-header .back-link { display: none; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand"><span class="cross">✝</span> Prayer Journal</div>
  <button class="nav-btn" onclick="showView('add')">+ New Entry</button>
</nav>

<!-- HOME VIEW -->
<div id="view-home" class="view active">
  <div class="home-hero">
    <h1>Your Prayer Journal</h1>
    <div class="gold-rule"></div>
    <p>Click any date to open that day's prayers</p>
  </div>
  <div class="entries-container" id="entries-list"></div>
</div>

<!-- ADD VIEW -->
<div id="view-add" class="view">
  <div class="form-container">
    <div class="form-header">
      <h2>New Prayer Entry</h2>
      <p>Add your prayers for today, with Scripture to stand on</p>
    </div>

    <div class="date-display">
      <label>Date</label>
      <input type="date" id="entry-date" />
    </div>

    <div id="prayer-blocks"></div>
    <button class="add-prayer-btn" onclick="addPrayerBlock()">+ Add Another Prayer</button>
    <button class="save-btn" onclick="saveEntry()">Save Today's Prayers</button>
  </div>
</div>

<!-- DAY VIEW -->
<div id="view-day" class="view">
  <div class="day-container" id="day-content"></div>
</div>

<!-- DELETE MODAL -->
<div class="modal-bg" id="delete-modal">
  <div class="modal">
    <h3>Delete Entry?</h3>
    <p>This will remove all prayers for this day. This cannot be undone.</p>
    <div class="modal-btns">
      <button class="cancel-m" onclick="closeModal()">Cancel</button>
      <button class="confirm" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────
const STORE_KEY = 'prayer_journal_v1';
let db = {};
let pendingDeleteKey = null;

function loadDb() {
  try { db = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) { db = {}; }
}
function saveDb() {
  localStorage.setItem(STORE_KEY, JSON.stringify(db));
}

// Pre-load May 18 2025 entry
const MAY18_KEY = '2025-05-18';
const may18Data = {
  date: MAY18_KEY,
  prayers: [
    {
      tag: "Health & Provision",
      title: "Health Insurance & Care for My Daughter",
      prayer: "Lord, open doors for amazing health insurance so I can take my daughter to the GI doctor. You are Jehovah-Jireh — my provider. Make a way where there seems to be none.",
      verses: [
        { ref: "Philippians 4:19", text: "And my God will supply every need of yours according to his riches in glory in Christ Jesus." },
        { ref: "Psalm 34:10", text: "The young lions suffer want and hunger; but those who seek the Lord lack no good thing." },
        { ref: "Jeremiah 29:11", text: "For I know the plans I have for you, declares the Lord, plans for welfare and not for evil, to give you a future and a hope." },
        { ref: "Matthew 7:11", text: "If you then, who are evil, know how to give good gifts to your children, how much more will your Father who is in heaven give good things to those who ask him!" }
      ]
    },
    {
      tag: "Favor & Vision",
      title: "God's Favor Over Every Area We Are Stepping Into",
      prayer: "Lord, pour out Your favor on me and my wife as we move into new territory. Give us both a clear vision so we walk boldly and together in what You have called us to.",
      verses: [
        { ref: "Proverbs 3:5–6", text: "Trust in the Lord with all your heart, and do not lean on your own understanding. In all your ways acknowledge him, and he will make straight your paths." },
        { ref: "Habakkuk 2:2", text: "Write the vision; make it plain on tablets, so he may run who reads it." },
        { ref: "Psalm 5:12", text: "For you bless the righteous, O Lord; you cover him with favor as with a shield." },
        { ref: "Numbers 6:24–26", text: "The Lord bless you and keep you; the Lord make his face shine on you and be gracious to you; the Lord turn his face toward you and give you peace." }
      ]
    },
    {
      tag: "Calling & Career",
      title: "My Wife's Voice Over & Acting Journey",
      prayer: "Lord, set her up fully for the gifts You placed inside her. Open doors no man can shut. Let every connection, opportunity, and resource fall into place for her calling.",
      verses: [
        { ref: "Proverbs 18:16", text: "A man's gift makes room for him and brings him before great men." },
        { ref: "Isaiah 43:19", text: "Behold, I am doing a new thing; now it springs forth, do you not perceive it? I will make a way in the wilderness and rivers in the desert." },
        { ref: "Romans 11:29", text: "For the gifts and the calling of God are irrevocable." },
        { ref: "Revelation 3:8", text: "I have placed before you an open door that no one can shut." }
      ]
    },
    {
      tag: "Brotherhood & Community",
      title: "A New Brother in Christ",
      prayer: "Lord, bring a man of God into my life — someone I can walk with, talk to, and grow with in faith. A true iron-sharpening-iron friendship rooted in You.",
      verses: [
        { ref: "Proverbs 27:17", text: "Iron sharpens iron, and one man sharpens another." },
        { ref: "Ecclesiastes 4:9–10", text: "Two are better than one, because they have a good reward for their toil. For if they fall, one will lift up his fellow." },
        { ref: "1 Thessalonians 5:11", text: "Therefore encourage one another and build one another up, just as you are doing." }
      ]
    },
    {
      tag: "Children & Wisdom",
      title: "Isla's Understanding in Math",
      prayer: "Lord, unlock Isla's mind for math. Give her understanding, patience, and confidence. Send teachers and tools that click for her. Let her see that she can do all things through You.",
      verses: [
        { ref: "Philippians 4:13", text: "I can do all things through him who strengthens me." },
        { ref: "James 1:5", text: "If any of you lacks wisdom, let him ask God, who gives generously to all without reproach, and it will be given him." },
        { ref: "Isaiah 54:13", text: "All your children shall be taught by the Lord, and great shall be the peace of your children." }
      ]
    },
    {
      tag: "Home & Stability",
      title: "Our Own Home",
      prayer: "Lord, make a way for us to have our own home — a place of peace, safety, and Your presence. A home we can raise our family in and give You glory from.",
      verses: [
        { ref: "Psalm 127:1", text: "Unless the Lord builds the house, those who build it labor in vain." },
        { ref: "Matthew 7:7–8", text: "Ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you." },
        { ref: "Deuteronomy 8:18", text: "You shall remember the Lord your God, for it is he who gives you power to get wealth." }
      ]
    },
    {
      tag: "Children & Provision",
      title: "Leia Getting Into School — God Opens the Door & Funds It",
      prayer: "God, make a way for Leia. Get her in and fund it completely. Nothing is too hard for You. Move on hearts, open doors, and release every resource needed for her education.",
      verses: [
        { ref: "Luke 1:37", text: "For nothing will be impossible with God." },
        { ref: "Jeremiah 32:27", text: "Behold, I am the Lord, the God of all flesh. Is anything too hard for me?" },
        { ref: "2 Corinthians 9:8", text: "God is able to make all grace abound to you, so that having all sufficiency in all things at all times, you may abound in every good work." }
      ]
    },
    {
      tag: "Health & Healing",
      title: "My Wife's Health — Hair Loss",
      prayer: "Lord, You are the Healer. Touch my wife's body. Restore what has been lost, bring balance and strength to her health, and let her feel Your care over every part of her.",
      verses: [
        { ref: "Exodus 15:26", text: "I am the Lord, your healer." },
        { ref: "Psalm 107:20", text: "He sent out his word and healed them, and delivered them from their destruction." },
        { ref: "Isaiah 41:10", text: "Fear not, for I am with you; be not dismayed, for I am your God; I will strengthen you, I will help you, I will uphold you with my righteous right hand." },
        { ref: "3 John 1:2", text: "Beloved, I pray that all may go well with you and that you may be in good health, as it goes well with your soul." }
      ]
    },
    {
      tag: "Healing & Restoration",
      title: "My Wife's Elbow — Full Restoration",
      prayer: "Lord, lay Your healing hand on her elbow. Restore full movement, reduce pain, and let her body respond to Your power. What medicine cannot fully fix, You can.",
      verses: [
        { ref: "Jeremiah 30:17", text: "For I will restore health to you, and your wounds I will heal, declares the Lord." },
        { ref: "Psalm 103:2–3", text: "Bless the Lord, O my soul, and forget not all his benefits, who forgives all your iniquity, who heals all your diseases." },
        { ref: "Isaiah 53:5", text: "With his wounds we are healed." },
        { ref: "Matthew 8:3", text: "And Jesus stretched out his hand and touched him, saying, I will; be clean. And immediately he was cleansed." }
      ]
    }
  ]
};

// ── INIT ──────────────────────────────────────────────────────────────────
loadDb();
if (!db[MAY18_KEY]) {
  db[MAY18_KEY] = may18Data;
  saveDb();
}

// ── VIEWS ─────────────────────────────────────────────────────────────────
function showView(name, dateKey) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'home') renderHome();
  if (name === 'add') initAddForm();
  if (name === 'day' && dateKey) renderDay(dateKey);
}

// ── HOME ──────────────────────────────────────────────────────────────────
function renderHome() {
  const el = document.getElementById('entries-list');
  const keys = Object.keys(db).sort((a,b) => b.localeCompare(a));
  if (!keys.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">✝</div><p>No prayers recorded yet.<br>Tap <strong>+ New Entry</strong> to begin.</p></div>`;
    return;
  }
  const byYear = {};
  keys.forEach(k => {
    const yr = k.split('-')[0];
    if (!byYear[yr]) byYear[yr] = [];
    byYear[yr].push(k);
  });
  let html = '';
  Object.keys(byYear).sort((a,b) => b-a).forEach(yr => {
    html += `<div class="year-label">${yr}</div>`;
    byYear[yr].forEach(k => {
      const entry = db[k];
      const d = new Date(k + 'T12:00:00');
      const month = d.toLocaleString('en',{month:'short'}).toUpperCase();
      const day = d.getDate();
      const weekday = d.toLocaleString('en',{weekday:'long'});
      const count = entry.prayers ? entry.prayers.length : 0;
      html += `<div class="entry-card" onclick="showView('day','${k}')">
        <div class="entry-date-info">
          <div class="entry-cal">
            <div class="month">${month}</div>
            <div class="day">${day}</div>
          </div>
          <div class="entry-info">
            <div class="weekday">${weekday}</div>
            <div class="count">${count} prayer${count!==1?'s':''} recorded</div>
          </div>
        </div>
        <div class="entry-arrow">›</div>
      </div>`;
    });
  });
  el.innerHTML = html;
}

// ── DAY ───────────────────────────────────────────────────────────────────
function renderDay(dateKey) {
  const entry = db[dateKey];
  if (!entry) { showView('home'); return; }
  const d = new Date(dateKey + 'T12:00:00');
  const fullDate = d.toLocaleString('en',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  let html = `<div class="day-header">
    <div class="back-link" onclick="showView('home')">← Back to Journal</div>
    <h2>${d.toLocaleString('en',{month:'long',day:'numeric'})}</h2>
    <div class="full-date">${fullDate}</div>
  </div>`;
  (entry.prayers || []).forEach((p, i) => {
    let verses = (p.verses||[]).map(v =>
      `<div class="verse-item"><div class="v-ref">${v.ref}</div><div class="v-text">"${v.text}"</div></div>`
    ).join('');
    html += `<div class="prayer-entry">
      <div class="p-tag">${p.tag || ''}</div>
      <h3>${p.title}</h3>
      <div class="p-rule"></div>
      <div class="p-text">${p.prayer}</div>
      ${verses}
    </div>`;
  });
  html += `<div class="day-actions">
    <button onclick="window.print()">Print / Save PDF</button>
    <button class="del-btn" onclick="promptDelete('${dateKey}')">Delete Entry</button>
  </div>`;
  document.getElementById('day-content').innerHTML = html;
}

// ── ADD FORM ──────────────────────────────────────────────────────────────
let blockCount = 0;
function initAddForm() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  document.getElementById('entry-date').value = `${yyyy}-${mm}-${dd}`;
  document.getElementById('prayer-blocks').innerHTML = '';
  blockCount = 0;
  addPrayerBlock();
}

function addPrayerBlock() {
  blockCount++;
  const id = blockCount;
  const div = document.createElement('div');
  div.className = 'prayer-form-block';
  div.id = `block-${id}`;
  div.innerHTML = `
    <div class="block-header">
      <span class="block-num">Prayer ${id}</span>
      <button class="remove-btn" onclick="removeBlock(${id})" title="Remove">✕</button>
    </div>
    <div class="form-row"><label>Category / Tag</label><input type="text" placeholder="e.g. Health & Healing, Favor, Children…" id="tag-${id}"></div>
    <div class="form-row"><label>Prayer Title</label><input type="text" placeholder="What are you believing God for?" id="title-${id}"></div>
    <div class="form-row"><label>Your Prayer</label><textarea placeholder="Write your prayer in your own words…" id="prayer-${id}"></textarea></div>
    <div class="form-row">
      <label>Scripture Verses</label>
      <div id="verses-${id}">
        <div class="verse-entry">
          <input type="text" class="ref-input" placeholder="Reference" id="ref-${id}-1">
          <input type="text" class="verse-input" placeholder="Verse text" id="vtext-${id}-1">
          <button onclick="removeVerseRow(this)">✕</button>
        </div>
      </div>
      <button class="add-verse-btn" onclick="addVerseRow(${id})">+ Add verse</button>
    </div>`;
  document.getElementById('prayer-blocks').appendChild(div);
}

function removeBlock(id) {
  const el = document.getElementById(`block-${id}`);
  if (el) el.remove();
}

let verseRowCounts = {};
function addVerseRow(blockId) {
  if (!verseRowCounts[blockId]) verseRowCounts[blockId] = 1;
  verseRowCounts[blockId]++;
  const n = verseRowCounts[blockId];
  const div = document.createElement('div');
  div.className = 'verse-entry';
  div.innerHTML = `<input type="text" class="ref-input" placeholder="Reference" id="ref-${blockId}-${n}">
    <input type="text" class="verse-input" placeholder="Verse text" id="vtext-${blockId}-${n}">
    <button onclick="removeVerseRow(this)">✕</button>`;
  document.getElementById(`verses-${blockId}`).appendChild(div);
}

function removeVerseRow(btn) {
  btn.closest('.verse-entry').remove();
}

function saveEntry() {
  const dateKey = document.getElementById('entry-date').value;
  if (!dateKey) { alert('Please select a date.'); return; }
  const blocks = document.querySelectorAll('.prayer-form-block');
  const prayers = [];
  blocks.forEach(block => {
    const id = block.id.replace('block-','');
    const tag = document.getElementById(`tag-${id}`)?.value.trim() || '';
    const title = document.getElementById(`title-${id}`)?.value.trim() || '';
    const prayer = document.getElementById(`prayer-${id}`)?.value.trim() || '';
    if (!title && !prayer) return;
    const verseRows = block.querySelectorAll('.verse-entry');
    const verses = [];
    verseRows.forEach(row => {
      const ref = row.querySelector('.ref-input')?.value.trim() || '';
      const text = row.querySelector('.verse-input')?.value.trim() || '';
      if (ref || text) verses.push({ ref, text });
    });
    prayers.push({ tag, title, prayer, verses });
  });
  if (!prayers.length) { alert('Please add at least one prayer.'); return; }
  if (db[dateKey]) {
    if (!confirm(`You already have an entry for ${dateKey}. Add these prayers to it?`)) return;
    db[dateKey].prayers = [...(db[dateKey].prayers || []), ...prayers];
  } else {
    db[dateKey] = { date: dateKey, prayers };
  }
  saveDb();
  showView('day', dateKey);
}

// ── DELETE ────────────────────────────────────────────────────────────────
function promptDelete(dateKey) {
  pendingDeleteKey = dateKey;
  document.getElementById('delete-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('delete-modal').classList.remove('open');
  pendingDeleteKey = null;
}
function confirmDelete() {
  if (pendingDeleteKey) { delete db[pendingDeleteKey]; saveDb(); }
  closeModal();
  showView('home');
}

// ── BOOT ──────────────────────────────────────────────────────────────────
renderHome();
</script>
</body>
</html>
